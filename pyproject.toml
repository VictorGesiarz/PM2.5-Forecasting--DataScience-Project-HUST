[project]
name = "hanoi-pm25-forecast"
version = "0.1.0"
description = "Next-day PM2.5 forecasting for Hanoi from OpenAQ + Open-Meteo data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=16",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.uv]
package = false
